network_name: nuw0wa_camb_TTTEEE
path: nuw0wa_camb_TTTEEE

# CosmoPower package prescription for generating CMB angular power spectra
# for the nuw0waCDM model.  This YAML retains only the CMB-related
# networks from the original unified package and increases the training
# sample size to 1.5×10^5 to better capture the additional
# (mnu, w0, wa) degrees of freedom compared to ΛCDM【953001340072815†L526-L532】.

emulated_code:
  name: camb
  version: '1.5.0'
  # CMB spectra depend on tau, so tau remains an input.  Note that
  # logT_AGN and z_pk are omitted because they are irrelevant for CMB.
  inputs: [ombh2, omch2, As, ns, H0, tau, mnu, w0, wa, N_eff]
  extra_args:
    lens_potential_accuracy: 8
    kmax: 100.0
    k_per_logint: 130
    lens_margin: 2050
    AccuracyBoost: 1.0
    lAccuracyBoost: 1.2
    lSampleBoost: 1.0
    DoLateRadTruncation: false
    min_l_logl_sampling: 6000
    recombination_model: CosmoRec
    dark_energy_model: ppf
    halofit_version: mead2020_feedback
    num_massive_neutrinos: 1
    neutrino_hierarchy: degenerate
    nnu: 3.044
    CMB_unit: muK
    raw_cl: false

samples:
  # Use 1.5e5 samples for the CMB dataset.  This is a modest increase
  # relative to the paper’s 1e5–1.2e5 guidance for extended models
  # because nuw0waCDM has three extra parameters【953001340072815†L526-L532】.
  Ntraining: 150000

generator:
  seed: 240507903
  n_shards: 15  # more shards provide finer granularity for CMB runs
  dtype: float32
  compression: gzip
  internal_transfer_nz: 256
  sigma8_integration:
    kmin: 1.0e-4
    kmax: 50.0
    nk: 600

parameters:
  ombh2: [0.015, 0.030]
  omch2: [0.090, 0.150]
  logA: [2.5, 3.5]
  tau: [0.02, 0.20]
  ns: [0.85, 1.05]
  h: [0.4, 1.0]
  mnu: [0.0, 0.5]
  w0: [-2.0, 0.0]
  wa: [-2.0, 2.0]

  # Derived parameters used by CAMB.  z_pk and logT_AGN are omitted
  # because they are not required for CMB spectra.
  H0: 'lambda h: h * 100.0'
  As: 'lambda logA: 1.0e-10 * np.exp(logA)'
  N_eff: 3.044

  # Scalar outputs from CAMB that are retained in the dataset and can
  # be emulated via the derived network.  These remain in the
  # parameter list to ensure they are captured.
  thetastar:
  sigma8_0:
  zstar:
  rstar:
  zdrag:
  rdrag:
  YHe:
  zrei:

training_defaults: &training_defaults
  validation_split: 0.1
  learning_rates: [1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7]
  batch_sizes: [1000, 2000, 5000, 10000, 20000, 50000]
  gradient_accumulation_steps: [1, 1, 1, 1, 1, 1]
  patience_values: [100, 100, 100, 100, 100, 100]
  max_epochs: [1000, 1000, 1000, 1000, 1000, 1000]

hidden_512x4: &hidden_512x4
  n_hidden: [512, 512, 512, 512]

networks:
  # Derived scalar quantities (e.g. θ*, σ8) are learned using a small
  # neural network.  They are included alongside the CMB power spectra.
  - quantity: 'derived'
    outputs: [thetastar, sigma8_0, zstar, rstar, zdrag, rdrag, YHe, zrei]
    inputs: [ombh2, omch2, logA, tau, ns, h, mnu, w0, wa]
    type: NN
    n_traits: *hidden_512x4
    training: *training_defaults

  # Temperature–temperature power spectrum
  - quantity: 'Cl/tt'
    inputs: [ombh2, omch2, logA, tau, ns, h, mnu, w0, wa]
    type: NN
    log: true
    modes:
      label: l
      range: [2, 10000]
    n_traits: *hidden_512x4
    training: *training_defaults

  # Temperature–E-mode cross spectrum using PCA+NN
  - quantity: 'Cl/te'
    inputs: [ombh2, omch2, logA, tau, ns, h, mnu, w0, wa]
    type: PCAplusNN
    modes:
      label: l
      range: [2, 10000]
    p_traits:
      n_pcas: 512
      n_batches: 10
    n_traits: *hidden_512x4
    training: *training_defaults

  # E-mode auto spectrum
  - quantity: 'Cl/ee'
    inputs: [ombh2, omch2, logA, tau, ns, h, mnu, w0, wa]
    type: NN
    log: true
    modes:
      label: l
      range: [2, 10000]
    n_traits: *hidden_512x4
    training: *training_defaults

  # B-mode spectrum (generated by lensing and recombination)
  - quantity: 'Cl/bb'
    inputs: [ombh2, omch2, logA, tau, ns, h, mnu, w0, wa]
    type: NN
    log: true
    modes:
      label: l
      range: [2, 10000]
    n_traits: *hidden_512x4
    training: *training_defaults

  # Lensing potential power spectrum (C_l^φφ)
  - quantity: 'Cl/pp'
    # Note: tau is excluded for the lensing potential following the
    # paper’s example; lensing is insensitive to reionization depth.
    inputs: [ombh2, omch2, logA, ns, h, mnu, w0, wa]
    type: PCAplusNN
    log: true
    modes:
      label: l
      range: [2, 10000]
    p_traits:
      n_pcas: 64
      n_batches: 10
    n_traits: *hidden_512x4
    training: *training_defaults
